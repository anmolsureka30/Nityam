<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which angle sends it the farthest?</title>
<style>
/* ── tokens ───────────────────────────────────────────────────────────────
   Data-mark colours are the validated categorical slots 1-3 and are FIXED.
   The theme tints the world (sky, story, icon) and never the data.          */
:root{
  color-scheme: light;
  --page:#f6f5f2; --card:#ffffff; --card-2:#faf9f7;
  --ink:#1a1a19; --ink-2:#55534e; --ink-3:#8a8880;
  --line:#e7e5e0; --line-2:#f0eeea;
  --s1:#2a78d6;  --s2:#eb6834;  --s3:#1baf7a;      /* trajectory · u_y · u_x */
  --good:#1a8f63; --good-bg:#e8f6f0; --warn:#b45b17; --warn-bg:#fdf0e6;
  --grid:rgba(26,26,25,.07); --ground:#e9e6df; --ground-line:#cfcbc1;
  --shadow:0 1px 2px rgba(26,26,25,.05), 0 8px 24px -12px rgba(26,26,25,.14);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#121211; --card:#1a1a19; --card-2:#1f1f1d;
    --ink:#f4f3ef; --ink-2:#b8b6ae; --ink-3:#83817a;
    --line:#2c2c29; --line-2:#232321;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good:#3fbc8a; --good-bg:#14261f; --warn:#e0894a; --warn-bg:#2a1e14;
    --grid:rgba(255,255,255,.07); --ground:#232320; --ground-line:#33332f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#121211; --card:#1a1a19; --card-2:#1f1f1d;
  --ink:#f4f3ef; --ink-2:#b8b6ae; --ink-3:#83817a;
  --line:#2c2c29; --line-2:#232321;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#3fbc8a; --good-bg:#14261f; --warn:#e0894a; --warn-bg:#2a1e14;
  --grid:rgba(255,255,255,.07); --ground:#232320; --ground-line:#33332f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.wrap{max-width:1120px;margin:0 auto;padding:26px 22px 56px}

/* ── top bar ─────────────────────────────────────────────────────────── */
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.dot{width:26px;height:26px;border-radius:8px;flex:none;
     background:linear-gradient(140deg,var(--s1),var(--s3));
     box-shadow:0 2px 8px -2px color-mix(in srgb,var(--s1) 60%,transparent)}
.brand b{font-size:15px;font-weight:650;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand i{font-style:normal;color:var(--line);margin:0 2px}
.picker{display:flex;align-items:center;gap:8px;flex:none}
.picker label{font-size:12px;color:var(--ink-3)}
select{
  appearance:none;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:7px 30px 7px 11px;font-size:13.5px;font-family:inherit;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238a8880' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;
}
select:hover{border-color:var(--ink-3)}

/* ── lesson header ───────────────────────────────────────────────────── */
.lesson{margin-bottom:20px}
.eyebrow{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
         letter-spacing:.07em;text-transform:uppercase;color:var(--s1);margin-bottom:9px}
.eyebrow::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--s1)}
.lesson h1{margin:0 0 7px;font-size:26px;line-height:1.25;font-weight:660;letter-spacing:-.022em;max-width:34ch}
.lesson p{margin:0;font-size:15px;color:var(--ink-2);max-width:56ch}

/* ── layout ──────────────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stage{padding:12px 12px 0;overflow:hidden}
canvas{width:100%;height:340px;display:block;border-radius:9px}
@media(max-width:900px){canvas{height:290px}}

.stagebar{display:flex;align-items:center;gap:9px;padding:11px 4px 13px;flex-wrap:wrap}
.spacer{flex:1}

/* ── buttons ─────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:9px 15px;font:inherit;font-size:13.5px;font-weight:530;
  cursor:pointer;min-height:38px;transition:background .13s,border-color .13s,transform .08s;
}
.btn:hover{background:var(--card-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.btn-primary{background:var(--s1);border-color:var(--s1);color:#fff;font-weight:580}
.btn-primary:hover{background:color-mix(in srgb,var(--s1) 86%,#000);border-color:color-mix(in srgb,var(--s1) 86%,#000)}
.btn svg{flex:none}
.pincount{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ── side panel ──────────────────────────────────────────────────────── */
.side{display:flex;flex-direction:column;gap:14px}
.pad{padding:16px}
.ttl{font-size:11px;font-weight:640;letter-spacing:.08em;text-transform:uppercase;
     color:var(--ink-3);margin-bottom:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}

.hero{margin-bottom:14px}
.hero-l{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.hero-v{font-size:38px;line-height:1.05;font-weight:640;letter-spacing:-.028em;
        font-variant-numeric:tabular-nums;transition:color .2s}
.hero-v u{font-style:normal;text-decoration:none;font-size:17px;font-weight:500;color:var(--ink-3);margin-left:4px}
.hero-v.bump{animation:bump .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(1)}42%{transform:scale(1.07)}100%{transform:scale(1)}}

.stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
      padding:7px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.stat-l{color:var(--ink-2);display:flex;align-items:center;gap:7px;min-width:0}
.swatch{width:9px;height:9px;border-radius:2.5px;flex:none}
.stat-v{font-variant-numeric:tabular-nums;font-weight:540;white-space:nowrap}

/* ── sliders ─────────────────────────────────────────────────────────── */
.ctl{margin-bottom:17px}
.ctl:last-of-type{margin-bottom:12px}
.ctl-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:10px}
.ctl-l{font-size:13.5px;color:var(--ink-2)}
.ctl-v{font-size:15px;font-weight:620;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:grab;margin:0;display:block;
}
input[type=range]:active{cursor:grabbing}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--line);border:none}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--line);border:none}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;margin-top:-8px;
  background:var(--card);border:2.5px solid var(--s1);
  box-shadow:0 1px 4px rgba(26,26,25,.22);transition:transform .12s;
}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:var(--card);border:2.5px solid var(--s1);
  box-shadow:0 1px 4px rgba(26,26,25,.22);
}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid color-mix(in srgb,var(--s1) 34%,transparent);outline-offset:2px}

/* ── annotation ──────────────────────────────────────────────────────── */
.annos{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.anno{
  display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--s1);
  border-radius:10px;padding:11px 14px;color:var(--ink);box-shadow:var(--shadow);
  animation:slide .26s ease-out;
}
.anno svg{flex:none;margin-top:2px;color:var(--s1)}
@keyframes slide{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* ── checkpoint ──────────────────────────────────────────────────────── */
.check{margin-top:18px;padding:20px}
.hide{display:none}
.q{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0 0 15px;max-width:46ch;line-height:1.35}
.opts{display:flex;gap:9px;flex-wrap:wrap}
.opt{
  background:var(--card);border:1.5px solid var(--line);border-radius:11px;
  padding:12px 22px;font:inherit;font-size:16px;font-weight:580;font-variant-numeric:tabular-nums;
  color:var(--ink);cursor:pointer;min-width:74px;min-height:46px;transition:all .13s;
}
.opt:hover:not(:disabled){border-color:var(--s1);background:color-mix(in srgb,var(--s1) 6%,var(--card));transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.bad{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.fb{margin-top:14px;font-size:14.5px;line-height:1.55;display:flex;gap:9px;align-items:flex-start;max-width:62ch}
.fb svg{flex:none;margin-top:2px}
.fb.ok{color:var(--good)} .fb.bad{color:var(--warn)}

/* ── noticed / evidence ──────────────────────────────────────────────── */
.noticed{margin-top:18px;padding:16px 18px}
.toggle{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);
        cursor:pointer;user-select:none;text-transform:none;letter-spacing:0;font-weight:500}
.toggle input{accent-color:var(--s1);margin:0;cursor:pointer}

.mastery{margin-bottom:14px}
.mastery-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-bottom:7px}
.mastery-top b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--s1),var(--s3));
       width:0;transition:width .6s cubic-bezier(.22,1,.36,1)}

.feed{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;padding-right:2px}
.empty{font-size:13.5px;color:var(--ink-3);padding:6px 0}
.ev{display:flex;gap:11px;align-items:flex-start;background:var(--card-2);
    border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;animation:slide .26s ease-out}
.ev-ic{width:22px;height:22px;border-radius:7px;flex:none;display:flex;align-items:center;
       justify-content:center;background:var(--line);color:var(--ink-2);font-size:12px}
.ev.good .ev-ic{background:var(--good-bg);color:var(--good)}
.ev.warn .ev-ic{background:var(--warn-bg);color:var(--warn)}
.ev-b{min-width:0;flex:1}
.ev-t{font-size:13.5px;line-height:1.45}
.ev-raw{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-3);
        margin-top:5px;word-break:break-all;display:none}
.showraw .ev-raw{display:block}

/* ── toast ───────────────────────────────────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  background:var(--ink);color:var(--page);padding:13px 20px;border-radius:12px;
  font-size:14.5px;font-weight:540;box-shadow:0 12px 32px -8px rgba(0,0,0,.42);
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;z-index:50;
  display:flex;align-items:center;gap:9px;max-width:calc(100vw - 40px);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── footer ──────────────────────────────────────────────────────────── */
.foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);
      font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-3);
      display:flex;flex-wrap:wrap;gap:7px 16px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="wrap">
    <div id="art"></div>
    <div class="foot" id="foot"></div>
  </div>
  <div class="toast" id="toast"></div>

<script>
//== runtime =================================================================
/* ---- kernel.js ---- */
/* kinematics2d - the trusted physics (JS twin of generate/kernel_py.py).
 *
 * Hand-written. Never generated. The IR chooses a kernel; it does not author one.
 * Kept in sync with the Python twin by the parity vectors embedded at build time. */
(function (NS) {
  var N = 90;

  function kinematics2d(inp) {
    var speed = inp.speed, angleDeg = inp.angle;
    var g = inp.gravity == null ? 9.8 : inp.gravity;
    var y0 = inp.y0 == null ? 0 : inp.y0;

    var rad = angleDeg * Math.PI / 180;
    var ux = speed * Math.cos(rad);
    var uy = speed * Math.sin(rad);

    var disc = uy * uy + 2 * g * y0;
    var tof = g > 0 ? (uy + Math.sqrt(Math.max(disc, 0))) / g : 0;

    var range = ux * tof;
    var maxHeight = uy > 0 ? y0 + (uy * uy) / (2 * g) : y0;

    var path = new Array(N + 1);
    for (var i = 0; i <= N; i++) {
      var t = tof * i / N;
      path[i] = { t: t, x: ux * t, y: y0 + uy * t - 0.5 * g * t * t, vx: ux, vy: uy - g * t };
    }

    return {
      ux: ux, uy: uy,
      range: range,
      max_height: maxHeight,
      time_of_flight: tof,
      path: path,
      launch_point: { x: 0, y: y0 }
    };
  }

  NS.KERNELS = { kinematics2d: kinematics2d };
})(window.Nityam = window.Nityam || {});


/* ---- evaluate.js ---- */
/* One evaluation cycle: state -> frame.
 *
 * Pure and cheap (closed-form kinematics is microseconds), so we just re-run it
 * on every slider tick. No animation loop, no diffing.
 *
 *   frame = { state, kernel, derived, theme }
 *
 * Everything the renderer and the probes read comes out of exactly this object. */
(function (NS) {

  NS.resolveRef = function (ref, ctx) {
    if (typeof ref === 'number') return ref;
    if (typeof ref !== 'string') return undefined;
    var i = ref.indexOf('.');
    if (i < 0) return undefined;
    var ns = ref.slice(0, i), name = ref.slice(i + 1);
    return ctx[ns] ? ctx[ns][name] : undefined;
  };

  NS.defaultState = function (ir) {
    var s = {};
    for (var k in ir.state) s[k] = ir.state[k].value;
    return s;
  };

  NS.evaluate = function (ir, state, theme) {
    var kfn = NS.KERNELS[ir.kernel];
    if (!kfn) throw new Error('unknown kernel: ' + ir.kernel);

    var inputs = {};
    for (var port in ir.kernel_inputs) {
      inputs[port] = NS.resolveRef(ir.kernel_inputs[port], { state: state });
    }
    var kernel = kfn(inputs);

    var derived = {};
    for (var name in ir.derived) {
      derived[name] = NS.resolveRef(ir.derived[name], { state: state, kernel: kernel });
    }

    return { state: state, kernel: kernel, derived: derived, theme: theme };
  };

  /* {{theme.x}} and {{value}} token substitution for labels and copy. */
  NS.fill = function (tpl, theme, value) {
    if (typeof tpl !== 'string') return tpl;
    return tpl
      .replace(/\{\{\s*theme\.([a-zA-Z_]+)\s*\}\}/g, function (_, k) { return theme[k] != null ? theme[k] : ''; })
      .replace(/\{\{\s*value\s*\}\}/g, value != null ? String(value) : '');
  };

})(window.Nityam = window.Nityam || {});


/* ---- probes.js ---- */
/* The probe engine: turns interaction into concept-tagged evidence.
 *
 * This is the part that makes an artifact a diagnostic instrument rather than a
 * visualisation. In the real product `emit` posts to the Learning Agent, which
 * calls update_student_memory(). Here it renders into the evidence stream so
 * you can watch it happen. */
(function (NS) {

  NS.createProbeEngine = function (ir, emit) {
    var settled = {};    // controlId -> { value: true }  (distinct parked values)
    var maxSeen = {};    // "derived.range" -> number
    var fired = {};      // probeId -> true
    var counts = {};     // probeId -> how many times it emitted

    function distinctSettled(cid) { return Object.keys(settled[cid] || {}).length; }

    function refValue(ref, frame) {
      var i = ref.indexOf('.');
      return NS.resolveRef(ref, frame);
    }

    function noteMax(ref, frame) {
      var v = refValue(ref, frame);
      if (typeof v !== 'number') return;
      if (maxSeen[ref] === undefined || v > maxSeen[ref]) maxSeen[ref] = v;
    }

    /* Structured conditions - data, not code, so they were validated at build time. */
    function evalCondition(cond, frame) {
      if (!cond) return false;
      if (cond.all) return cond.all.every(function (c) { return evalCondition(c, frame); });
      if (cond.any) return cond.any.some(function (c) { return evalCondition(c, frame); });

      if (cond.near) {
        var v = refValue(cond.near.ref, frame);
        return typeof v === 'number' && Math.abs(v - cond.near.value) <= (cond.near.tol == null ? 1e-9 : cond.near.tol);
      }
      if (cond.distinct_settled) {
        var d = cond.distinct_settled, n = distinctSettled(d.control);
        if (d.gte != null) return n >= d.gte;
        if (d.eq != null) return n === d.eq;
        return false;
      }
      if (cond.is_max_seen) {
        var r = cond.is_max_seen.ref, cur = refValue(r, frame);
        return typeof cur === 'number' && maxSeen[r] !== undefined && cur >= maxSeen[r] - 1e-9;
      }
      return false;
    }
    NS.evalCondition = evalCondition;   // reused by annotation layers

    function fire(probe, frame) {
      var payload = {};
      (probe.payload || []).forEach(function (ref) {
        var v = refValue(ref, frame);
        payload[ref] = typeof v === 'number' ? Math.round(v * 100) / 100 : v;
      });
      counts[probe.id] = (counts[probe.id] || 0) + 1;
      if (probe.once) fired[probe.id] = true;

      emit({
        t: Date.now(),
        probe: probe.id,
        event: probe.emit,
        concept: probe.concept || null,
        misconception: probe.misconception || null,
        note: probe.note || null,
        student_text: probe.student_text || null,
        payload: payload
      });
    }

    function evaluatePredicates(frame) {
      ir.probes.forEach(function (p) {
        if (p.on !== 'predicate' || fired[p.id]) return;
        if (evalCondition(p.when, frame)) fire(p, frame);
      });
    }

    return {
      /* Called ~400ms after the student stops dragging a control. */
      onSettle: function (controlId, frame) {
        settled[controlId] = settled[controlId] || {};
        var ctrl = ir.controls.filter(function (c) { return c.id === controlId; })[0];
        if (ctrl && ctrl.bind) settled[controlId][NS.resolveRef(ctrl.bind, frame)] = true;

        ir.probes.forEach(function (p) { if (p.payload) p.payload.forEach(function (r) { noteMax(r, frame); }); });

        ir.probes.forEach(function (p) {
          if (p.on === 'control_settle' && p.control === controlId && !fired[p.id]) fire(p, frame);
        });
        evaluatePredicates(frame);
      },
      count: function (probeId) { return counts[probeId] || 0; },
      state: function () { return { settled: settled, maxSeen: maxSeen, counts: counts }; }
    };
  };

})(window.Nityam = window.Nityam || {});


/* ---- render.js ---- */
/* The renderer: frame -> pixels + DOM.
 *
 * Hand-written, deterministic, identical for every artifact. The IR chooses
 * which layers to stack and what to bind them to; it has no say over layout,
 * colour or type. That is a deliberate trade - less visual variety, total
 * predictability, and one place to make everything look good.
 *
 * Colour rule: data marks use fixed, CVD-validated colours (categorical slots
 * 1-3). The THEME tints the world - sky, story, icon - and never the data. */
(function (NS) {

  var SVG = {
    play:  '<svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><path d="M3.5 1.8v9.4a.6.6 0 0 0 .92.5l7.2-4.7a.6.6 0 0 0 0-1L4.42 1.3a.6.6 0 0 0-.92.5z"/></svg>',
    pin:   '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 8.5V13"/><path d="M4 1h6l-.8 4.2L11 7.2v1.3H3V7.2l1.8-2z"/></svg>',

    var anim = { playing: false, u: 0, burst: 0, t0: 0, dur: 1 };
    var raf = null;

    function frame() { return NS.evaluate(ir, state, theme); }

    /* ── draw ─────────────────────────────────────────────────────────── */
    function redraw() {
      var f = frame();
      NS.drawScene(R.canvas, ir, f, snapshots, theme, anim);
      NS.updateReadouts(R, f);
      NS.updateAnnotations(ir, R, f, theme);
      for (var id in R.sliders) {
        var s = R.sliders[id], v = state[s.spec.bind.split('.')[1]];
        if (parseFloat(s.input.value) !== v) s.input.value = v;
        s.badge.textContent = NS.fill(s.spec.display || '{{value}}', theme, v);
      }
      if (R.pins) {
        var cap = (ir.controls.filter(function (c) { return c.action === 'snapshot'; })[0] || {}).max || 3;
        R.pins.textContent = snapshots.length ? snapshots.length + '/' + cap + ' pinned' : '';
      }
      return f;
    }

    /* ── animation: fly the projectile along its own trajectory ───────── */
    function tick(ts) {
      if (!anim.t0) anim.t0 = ts;
      var e = (ts - anim.t0) / 1000;
      if (anim.playing) {
        anim.u = Math.min(1, e / anim.dur);
        if (anim.u >= 1) { anim.playing = false; anim.u = 1; }
      }
      if (anim.burst > 0) anim.burst = Math.max(0, anim.burst - 0.018);
      redraw();
      if (anim.playing || anim.burst > 0) raf = requestAnimationFrame(tick);
      else raf = null;
    }
    function play() {
      var tof = frame().kernel.time_of_flight || 1;
      anim.playing = true; anim.u = 0; anim.t0 = 0;
      anim.dur = Math.min(2.2, Math.max(0.75, tof * 0.42));   // real-ish, never tedious
      if (!raf) raf = requestAnimationFrame(tick);
    }
    function celebrate(msg) {
      anim.burst = 1; anim.t0 = 0;
      if (!raf) raf = requestAnimationFrame(tick);
      if (opts.toast) {
        opts.toast.innerHTML = R.SVG.check + '<span></span>';
        opts.toast.lastChild.textContent = msg;
        opts.toast.classList.add('on');
        clearTimeout(timers._toast);
        timers._toast = setTimeout(function () { opts.toast.classList.remove('on'); }, 3600);
      }
    }

    /* ── evidence ─────────────────────────────────────────────────────── */

    /* Students should not read `artifact.discovered_optimum`. Probes carry a
       `note` for the agent; this turns an event into one plain sentence. */
    function humanise(e) {
      if (e.student_text) return e.student_text;
      switch (e.event) {
        case 'artifact.explored':
          var k = Object.keys(e.payload);
          return 'You tried ' + k.map(function (r) {
            return r.split('.')[1] + ' ' + e.payload[r];
          }).join(', ') + '.';
        case 'artifact.discovered_optimum':
          return 'You found the best setting by testing it yourself — that sticks better than being told.';
        case 'artifact.misconception_behavior':
          return 'You have been changing one thing only. Try the other slider and see what happens.';
        case 'assessment.answered':
          return e.payload.correct ? 'Checkpoint correct.' : 'Not quite — worth another look at the graph.';
        default:
          return e.note || e.event;
      }
    }

    function emitEvidence(e) {
      evidenceLog.push(e);
      renderEvidence(e);
      updateMastery();
      if (e.event === 'artifact.discovered_optimum') celebrate('Nice — you worked that out yourself.');
      if (e.event === 'assessment.answered' && e.payload.correct) celebrate('Checkpoint cleared.');
      if (opts.onEvidence) opts.onEvidence(e);
      console.log('[nityam:evidence]', e.event, e);
      refreshGates();
    }

    function renderEvidence(e) {
      var empty = R.feed.querySelector('.empty');
      if (empty) empty.remove();
      var row = document.createElement('div');
      row.className = 'ev' + (e.misconception ? ' warn' : (/discovered|correct/.test(e.event) || (e.payload && e.payload.correct) ? ' good' : ''));
      var ic = document.createElement('div');
      ic.className = 'ev-ic';
      ic.innerHTML = e.misconception ? R.SVG.idea : (/discovered/.test(e.event) ? R.SVG.check : '·');
      row.appendChild(ic);
      var b = document.createElement('div'); b.className = 'ev-b';
      var t = document.createElement('div'); t.className = 'ev-t';
      t.textContent = humanise(e);
      b.appendChild(t);
      var raw = document.createElement('div'); raw.className = 'ev-raw';
      raw.textContent = e.event + ' ' + JSON.stringify(e.payload) +
        (e.concept ? '  concept=' + e.concept : '') + (e.misconception ? '  misconception=' + e.misconception : '');
      b.appendChild(raw);
      row.appendChild(b);
      R.feed.insertBefore(row, R.feed.firstChild);
    }

    /* A visible stand-in for update_student_memory(). In the real app the
       agent owns this number; here we approximate it from the evidence. */
    function updateMastery() {
      var m = 0;
      evidenceLog.forEach(function (e) {
        if (e.event === 'artifact.explored') m += 8;
        else if (e.event === 'artifact.discovered_optimum') m += 34;
        else if (e.event === 'assessment.answered') m += e.payload.correct ? 30 : -6;
        else if (e.event === 'artifact.misconception_behavior') m -= 5;

      m = Math.max(0, Math.min(100, Math.round(m)));
      R.bar.fill.style.width = m + '%';
      R.bar.label.textContent = m + '%';
    }

    /* ── checkpoint ───────────────────────────────────────────────────── */
    function refreshGates() {
      if (!R.check) return;
      var q = ir.assessment[0];
      var open = !q.gate || probes.count(q.gate.probe) >= (q.gate.count_gte || 1);
      if (!open || !R.check.classList.contains('hide')) return;
      R.check.classList.remove('hide');
      buildQuestion(q);
      if (answered[q.id] !== undefined) markAnswer(q, answered[q.id], R.check.querySelector('.opts'));
    }

    function buildQuestion(q) {
      R.check.innerHTML = '';
      var t = document.createElement('div'); t.className = 'ttl'; t.textContent = 'Checkpoint';
      R.check.appendChild(t);
      var p = document.createElement('p'); p.className = 'q'; p.textContent = NS.fill(q.prompt, theme);
      R.check.appendChild(p);
      var row = document.createElement('div'); row.className = 'opts';
      q.options.forEach(function (o) {
        var b = document.createElement('button');
        b.className = 'opt'; b.textContent = o + (q.unit || ''); b.dataset.v = o;
        b.onclick = function () { answered[q.id] = o; markAnswer(q, o, row); emitAnswer(q, o); };
        row.appendChild(b);

      R.check.appendChild(row);
      var fb = document.createElement('div'); fb.className = 'fb';
      R.check.appendChild(fb);
    }

    function markAnswer(q, chosen, row) {
      var correct = chosen === q.expected;
      if (row) Array.prototype.forEach.call(row.children, function (b) {
        b.disabled = true;
        var v = parseFloat(b.dataset.v);
        if (v === q.expected) b.classList.add('ok');
        else if (v === chosen) b.classList.add('bad');
      });
      var fb = R.check.querySelector('.fb');
      if (fb) {
        fb.className = 'fb ' + (correct ? 'ok' : 'bad');
        fb.innerHTML = (correct ? R.SVG.check : R.SVG.cross) + '<span></span>';
        fb.lastChild.textContent = correct ? (q.explain_correct || 'Correct.') : (q.explain_wrong || 'Not quite.');

    function emitAnswer(q, chosen) {

      emitEvidence({
        t: Date.now(), probe: q.id, event: 'assessment.answered',
        concept: q.concept || null,
        misconception: correct ? null : (q.diagnose || {})[String(chosen)] || null,
        note: correct ? 'Correct after exploration.' : 'Incorrect - diagnosis attached.',
        payload: { chosen: chosen, expected: q.expected, correct: correct }

    /* ── handlers ─────────────────────────────────────────────────────── */
    var h = {
      themes: themes, themeKey: themeKey, theme: theme,
      eyebrow: ir.intent.eyebrow || 'Explore',

      onControl: function (c, value) {
        state[c.bind.split('.')[1]] = value;
        anim.playing = false;
        redraw();
        clearTimeout(timers[c.id]);
        timers[c.id] = setTimeout(function () { probes.onSettle(c.id, frame()); }, SETTLE_MS);
      },

      onAction: function (c) {
        if (c.action === 'snapshot') {

        redraw();
      },

      onPlay: play,

      onTheme: function (k) {
        themeKey = k; theme = themes[k]; h.theme = theme; h.themeKey = k;
        R = NS.buildDOM(ir, container, h);
        redraw();
        evidenceLog.forEach(renderEvidence);   // oldest first -> newest ends up on top
        updateMastery();
        refreshGates();
      }
    };

    R = NS.buildDOM(ir, container, h);
    probes = NS.createProbeEngine(ir, emitEvidence);
    redraw();
    updateMastery();
    window.addEventListener('resize', redraw);
    setTimeout(play, 380);      // one launch on load, so the artifact reads as alive

    /* Kernel parity: the JS kernel must reproduce what the Python kernel
       produced at build time. Turns silent drift into a visible failure. */
    if (opts.parity) {
      var worst = 0;
      opts.parity.forEach(function (v) {
        var got = NS.KERNELS[ir.kernel](v.in);

                  (worst < 1e-9 ? '  OK' : '  *** KERNEL DRIFT ***'));
      if (opts.onParity) opts.onParity(worst);
    }

    return {
      destroy: function () {
        window.removeEventListener('resize', redraw);
        if (raf) cancelAnimationFrame(raf);
        container.innerHTML = '';
      },
      play: play,
      getState: function () { return Object.assign({}, state); },
      getEvidence: function () { return evidenceLog.slice(); },
      getProbeState: function () { return probes.state(); }
    };
  };

})(window.Nityam = window.Nityam || {});

</script>
