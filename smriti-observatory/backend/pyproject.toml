[project]
name = "smriti-observatory-backend"
version = "0.1.0"
description = "Real-time visualization backend for the SMRITI memory layer."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "google-cloud-firestore>=2.16",
]

[tool.uv.sources]
# `tutor` is a dev-only dependency now (see [dependency-groups] dev below):
# only tests/test_end_to_end.py imports it, to drive a real integration test
# against sub_modules_examples/tutor specifically. The production code path
# (observatory/main.py, routes_rest.py, events.py) no longer imports `app.*`
# at all, so it has no coupling to either agent app's package and can point
# at backend/ (which also ships a top-level module named `app`) without a
# naming collision. See
# docs/superpowers/specs/2026-08-28-backend-memory-observatory-design.md §3.
tutor = { path = "../../sub_modules_examples/tutor", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "tutor",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["observatory"]
